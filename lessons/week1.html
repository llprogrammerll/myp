<!DOCTYPE html>
<html>
<head>
  <title>Week 1: Digital Input</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css" rel="stylesheet"/>
  <style>
    body { margin: 0; font-family: Arial; }
    #editor { height: 300px; border: 1px solid #ccc; }
    button { background: #0066cc; color: white; padding: 10px; width: 100%; border: none; }
  </style>
</head>
<body>
  <h2>Digital Input: Button → LED</h2>
  <textarea id="code">// Write your code here
void setup() {
  pinMode(2, INPUT);
  pinMode(13, OUTPUT);
}

void loop() {
  if (digitalRead(2) == HIGH) {
    digitalWrite(13, HIGH);
  } else {
    digitalWrite(13, LOW);
  }
}</textarea>

  <button onclick="run()">Run in Simulator</button>
  <div id="simulator">
    <iframe src="https://wokwi.com" style="width:100%; height:400px; border:none;"></iframe>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>
  <script>
    var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
      mode: "text/x-csrc", lineNumbers: true, theme: "monokai"
    });

    function run() {
      // In real app: send code to Wokwi API
      alert("Code sent to simulator!");
    }
  </script>
</body>
</html>
