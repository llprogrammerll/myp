<head>

    body { font-family: Arial; margin: 0; padding: 20px; background: #f0f2f5; }

<body>
  <h2>Week 1: Digital Input/Output & Analog Read</h2>
  <p><strong>Goal:</strong> Control LEDs with buttons & map potentiometer to brightness.</p>
  
  <h3>Pre-Quiz (5 Qs)</h3>
  <div id="quiz">
    <label><input type="radio" name="q1" value="a"> digitalRead(2)</label><br>
    <label><input type="radio" name="q1" value="b"> analogRead(2)</label><br>
    <!-- Add more Qs; JS below auto-grades -->
    <button onclick="gradeQuiz()">Submit Quiz</button>
  </div>
  
  <h3>Code Editor</h3>
  <textarea id="code">// Week 1 Example: Button -> LED
void setup() {
  pinMode(2, INPUT);   // Button on pin 2
  pinMode(13, OUTPUT); // Built-in LED
  Serial.begin(9600);
}

void loop() {
  int button = digitalRead(2);
  digitalWrite(13, button); // Mirror button to LED
  
  int pot = analogRead(A0); // Potentiometer
  int mapped = map(pot, 0, 1023, 0, 255);
  Serial.println(mapped);   // Plot in Serial Monitor
}</textarea>
  
  <button onclick="runCode()">Run in Wokwi Simulator</button>
  <iframe id="sim" src="https://wokwi.com/projects/380000000000/share" style="display:none;"></iframe>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script>
    const editor = CodeMirror.fromTextArea(document.getElementById('code'), {
      mode: 'text/x-c++src',
      lineNumbers: true,
      theme: 'default'
    });
    
    function runCode() {
      document.getElementById('sim').src = 'https://wokwi.com/projects/380000000000/share?code=' + encodeURIComponent(editor.getValue());
      document.getElementById('sim').style.display = 'block';
      localStorage.setItem('week1-code', editor.getValue()); // Auto-save
    }
    
    function gradeQuiz() {
      // Simple auto-grade logic (expand for full quiz)
      alert('Score: 4/5! Great job. Full quiz in JS file.');
    }
    
    // Load saved code
    editor.setValue(localStorage.getItem('week1-code') || '// Start coding...');
  </script>
