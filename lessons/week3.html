// Week 3: Timer1 ISR
void setupTimer1() {
  noInterrupts();
  TCCR1A = 0; TCCR1B = 0;
  TCNT1 = 0;
  OCR1A = 39999; // ~1 sec @ 16MHz
  TCCR1B |= (1 << WGM12) | (1 << CS12) | (1 << CS10); // CTC + prescaler
  TIMSK1 |= (1 << OCIE1A);
  interrupts();
}

ISR(TIMER1_COMPA_vect) {
  digitalWrite(13, !digitalRead(13)); // Toggle LED
}

void setup() { pinMode(13, OUTPUT); setupTimer1(); }
void loop() {} // Empty!</textarea>
