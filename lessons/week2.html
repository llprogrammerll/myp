  <h2>Week 2: PWM Fade & attachInterrupt()</h2>
  <p><strong>Goal:</strong> Fade LED with analogWrite() & toggle on button press.</p>
  
  <!-- Quiz section like Week 1 -->
  
  <h3>Code Editor</h3>
  <textarea id="code">// Week 2: PWM + Interrupt
volatile bool interrupted = false;
int brightness = 0;

void setup() {
  pinMode(9, OUTPUT); // PWM pin
  attachInterrupt(digitalPinToInterrupt(2), isr, FALLING); // Button interrupt
}

void loop() {
  analogWrite(9, brightness);
  brightness = (brightness + 5) % 256;
  delay(30);
  
  if (interrupted) {
    interrupted = false; // Debounce
    // Toggle action here
  }
}

void IRAM_ATTR isr() {
  interrupted = true;
}</textarea>
